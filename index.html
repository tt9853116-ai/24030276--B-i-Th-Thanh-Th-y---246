<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu cá nhân</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #2f4863; background: #eff8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
    main { position: relative; width: min(100%, 680px); padding: clamp(28px, 6vw, 52px); border: 1px solid #d8ecfa; border-radius: 20px; background: #fff; box-shadow: 0 16px 40px rgba(52, 120, 170, .10); }
    .top-nav { display: flex; justify-content: flex-end; margin: 0 0 24px; }
    .top-nav a { padding: 10px 15px; border-radius: 999px; color: #356d98; background: #e5f3fd; font-size: .9rem; font-weight: 700; text-decoration: none; }
    .top-nav a:hover { background: #d5ebfb; }
    .eyebrow { margin: 0 0 10px; color: #5b9bc8; font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 30px; color: #356d98; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    section { display: grid; gap: 18px; }
    footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid #d8ecfa; color: #5b9bc8; font-size: .9rem; text-align: center; }
    article { padding: 18px 20px; border-radius: 12px; background: #f2f9fe; }
    h2 { margin: 0; color: #477fa8; font-size: 1rem; }
    @media (max-width: 480px) { main { border-radius: 16px; } article { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <nav class="top-nav" aria-label="Điều hướng"><a href="event.html">Sự kiện</a></nav>
    <p class="eyebrow">Trang giới thiệu</p>
    <h1>Giới thiệu cá nhân</h1>
    <section aria-label="Thông tin giới thiệu">
      <article><h2>Họ và tên</h2></article>
      <article><h2>Chuyên ngành</h2></article>
      <article><h2>Kỹ năng</h2></article>
      <article><h2>Mục tiêu nghề nghiệp</h2></article>
    </section>
    <footer>Được tạo bằng Codex.</footer>
  </main>
</body>
</html>
