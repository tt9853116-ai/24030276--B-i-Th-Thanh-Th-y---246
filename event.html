<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Career Day</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #172554; background: #f2f7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 18px; display: grid; place-items: center; }
    main { width: min(100%, 860px); overflow: hidden; border: 1px solid #dbeafe; border-radius: 28px; background: white; box-shadow: 0 24px 70px rgba(37, 99, 235, .12); }
    .hero { position: relative; padding: clamp(34px, 8vw, 72px); color: white; background: linear-gradient(130deg, #2563eb, #4f46e5 58%, #7c3aed); }
    .hero::after { content: ""; position: absolute; width: 220px; height: 220px; right: -55px; top: -90px; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; box-shadow: 0 0 0 28px rgba(255,255,255,.06), 0 0 0 58px rgba(255,255,255,.04); }
    .top-nav { position: absolute; z-index: 2; top: 22px; right: 24px; }
    .top-nav a { display: inline-block; padding: 10px 15px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; color: white; background: rgba(255,255,255,.14); font-size: .9rem; font-weight: 700; text-decoration: none; }
    .top-nav a:hover { background: rgba(255,255,255,.25); }
    .audience { display: inline-block; margin: 0 0 20px; padding: 8px 13px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: rgba(255,255,255,.12); font-size: .9rem; }
    h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1.02; letter-spacing: -.055em; }
    .content { padding: clamp(24px, 6vw, 48px); }
    .highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .highlight { min-height: 140px; padding: 22px; border-radius: 18px; background: #eff6ff; }
    .highlight.deadline { color: #9a3412; background: #fff7ed; }
    .label { margin: 0 0 12px; color: #64748b; font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .deadline .label { color: #c2410c; }
    .value { margin: 0; color: #1d4ed8; font-size: clamp(1.15rem, 3vw, 1.65rem); font-weight: 800; line-height: 1.2; }
    .deadline .value { color: #c2410c; }
    .details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 22px; }
    .detail { padding: 18px 20px; border: 1px solid #e2e8f0; border-radius: 15px; }
    .detail .label { margin-bottom: 7px; }
    .detail p:last-child { margin: 0; color: #263b5d; font-weight: 650; }
    @media (max-width: 620px) { .highlights { grid-template-columns: 1fr; } .highlight { min-height: 0; } .details { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <nav class="top-nav" aria-label="Điều hướng"><a href="event.html">Giới thiệu về tôi</a></nav>
      <p class="audience">Sinh viên đại học</p>
      <h1>AI Career<br>Day</h1>
    </header>
    <section class="content" aria-label="Thông tin sự kiện">
      <div class="highlights">
        <article class="highlight">
          <p class="label">Ngày</p>
          <p class="value">15 tháng 11</p>
        </article>
        <article class="highlight">
          <p class="label">Thời gian</p>
          <p class="value">14:00–16:00</p>
        </article>
        <article class="highlight deadline">
          <p class="label">Hạn đăng ký</p>
          <p class="value">10 tháng 11</p>
        </article>
      </div>
      <div class="details">
        <article class="detail">
          <p class="label">Địa điểm</p>
          <p>Phòng hội thảo A</p>
        </article>
        <article class="detail">
          <p class="label">Chi phí</p>
          <p>Miễn phí</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
